<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Sito Sospetto</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; background-color: #fff9c4; }
        .login-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; margin: 0 auto; }
        input { width: 90%; padding: 10px; margin: 10px 0; }
        button { width: 100%; padding: 10px; background: #f57f17; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Accedi al servizio</h2>
        <p>Inserisci i tuoi dati:</p>
        <!-- 
            Vulnerabilità CWE-598 (Use of GET Request with Sensitive Query Strings):
            L'invio di credenziali in chiaro tramite metodo HTTP GET accoda i dati alla query string,
            esponendoli nei log web, nella cronologia del browser e negli header Referer.
            Nello stesso dominio genera un avviso di livello medio (WARN, Score >= 40).
        -->
        <form action="" method="GET">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
        <!-- 
            Elemento iframe invisibile inserito per calibrare lo score euristico client-side (triage)
            senza superare la soglia critica di blocco (BLOCK, Score >= 75).
        -->
        <iframe src="about:blank" style="display:none;"></iframe>
    </div>
</body>
</html>
